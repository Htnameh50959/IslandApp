name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Signing material comes from repository secrets, never from the tree.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ISLAND_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks
          else
            echo "::warning::ISLAND_KEYSTORE_BASE64 is not set; the release build will use the committed/debug key."
          fi

      - name: Build signed release
        env:
          ISLAND_RELEASE_STORE_PASSWORD: ${{ secrets.ISLAND_KEYSTORE_PASSWORD }}
          ISLAND_RELEASE_KEY_PASSWORD: ${{ secrets.ISLAND_KEY_PASSWORD }}
          ISLAND_RELEASE_KEY_ALIAS: ${{ secrets.ISLAND_KEY_ALIAS }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          CODE="${GITHUB_RUN_NUMBER}"
          ./gradlew assembleRelease \
            -Pisland.versionName="$VERSION" \
            -Pisland.versionCode="$CODE" \
            --stacktrace

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Island-${GITHUB_REF_NAME}.apk"

      - name: Attach APK to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
